name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --draft \
              --title "Photo Roulette ${TAG#v}" --generate-notes

  build:
    name: Package (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact_glob: dist/*.dmg
          - name: Windows
            os: windows-latest
            artifact_glob: dist/*.exe
          - name: Linux
            os: ubuntu-24.04
            artifact_glob: |
              dist/*.deb
              dist/*.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Building version ${TAG#v}"

      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.name == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build macOS DMG
        if: matrix.name == 'macOS'
        env:
          UNIVERSAL: "1"
        run: ./packaging/macos/make-dmg.sh

      - name: Build Windows binary
        if: matrix.name == 'Windows'
        run: cargo build --release --locked

      - name: Install Inno Setup
        if: matrix.name == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "packaging/windows/PhotoRoulette.iss"

      - name: Build Linux packages
        if: matrix.name == 'Linux'
        run: ./packaging/linux/build-packages.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: photo-roulette-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: Attach installers to release
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach files and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          find release-assets -maxdepth 2 -type f -print
          gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
