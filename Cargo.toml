[package]
name = "photo-roulette"
version = "1.0.0"
edition = "2024"
description = "A tiny photo and video roulette for group cringe sessions."
authors = ["Panagiotis Smponias"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/Panolix/Photo-Roulette"
homepage = "https://github.com/Panolix/Photo-Roulette"
readme = "README.md"
keywords = ["photo", "video", "egui", "roulette", "party"]
categories = ["graphics", "multimedia", "gui"]

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "exr",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
rand = "0.9"
rfd = "0.15"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
